# ============================================================================
# PostgreSQL Configuration for Ronak-Verse
# ============================================================================
# Optimized for Raspberry Pi 5 with 8GB RAM
# ============================================================================

# Connection Settings
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings (Optimized for 8GB Raspberry Pi)
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Query Planner
random_page_cost = 1.1  # SSD storage
effective_io_concurrency = 200  # SSD storage

# WAL Settings
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# Logging
logging_collector = on
log_destination = 'stderr'
log_statement = 'none'  # Change to 'all' for debugging
log_duration = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_min_duration_statement = 1000  # Log queries longer than 1 second

# Performance
shared_preload_libraries = 'pg_stat_statements'
